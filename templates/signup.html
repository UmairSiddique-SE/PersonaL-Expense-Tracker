<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Expense Tracker</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#0056b3">
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}" sizes="192x192">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Expense Tracker">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background: var(--bg-gradient);
            color: var(--text-primary);
            padding: 70px 16px 30px;
            position: relative;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .app-header {
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: var(--navbar-bg);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
        }

        .brand-link {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-link img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
        }

        .auth-card {
            width: 100%;
            max-width: 440px; 
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 36px 30px;
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(20px);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .auth-card:hover {
            box-shadow: var(--shadow-hover);
        }

        h2 {
            margin-bottom: 22px;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 15px 18px;
            border-radius: 16px;
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            color: var(--input-text);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: var(--input-placeholder);
        }

        input:hover,
        select:hover {
            border-color: var(--border-glow);
        }

        input:focus,
        select:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px var(--input-focus-glow);
            transform: translateY(-1px);
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .toggle-eye {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            user-select: none;
            font-size: 18px;
            opacity: 0.75;
            transition: opacity 0.2s ease;
        }

        .toggle-eye:hover { opacity: 1; }

        select option {
            background-color: var(--select-option-bg);
            color: var(--select-option-text);
            padding: 10px;
        }

        .btn-auth {
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            border: none;
            background: var(--button-gradient);
            color: var(--button-text);
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 0.8px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.25);
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(56, 189, 248, 0.4);
        }

        .footer-link {
            margin-top: 22px;
            color: var(--text-secondary);
            font-size: 14.5px;
        }

        .footer-link a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 700;
        }

        .footer-link a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        @media (max-width: 520px) {
            .auth-card {
                padding: 28px 20px;
                border-radius: 24px;
            }

            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
      <a href="{{ url_for('index') }}" class="brand-link">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
        Expense Tracker
      </a>
      <button class="theme-toggle-btn" onclick="toggleTheme()" type="button">
        <span class="theme-icon">🌙</span>
        <span class="theme-label">Dark</span>
      </button>
    </header>

    <div class="auth-card">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-container">
              {% for category, message in messages %}
                <div class="flash-message {{ category }}">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <h2>SIGN UP</h2>
        <form action="/signup" method="POST">
            <input type="text" name="first_name" placeholder="Full Name" required>
            <input type="email" name="username" placeholder="Username@gmail.com" 
                   pattern=".+@gmail\.com" title="Must be a valid @gmail.com address" required>
            
            <div class="password-wrapper">
                <input type="password" id="signup-password" name="password" placeholder="Password (min 8 characters)"
                       autocomplete="new-password" pattern=".{8,}" title="Password must be at least 8 characters" required>
                <span class="toggle-eye" onclick="togglePassword('signup-password', this)">👁️</span>
            </div>

            <select name="security_question" required>
                <option value="" disabled selected hidden>Select a security question</option>
                <option value="What was your first school's name?">What was your first school's name?</option>
                <option value="What city were you born in?">What city were you born in?</option>
                <option value="What is your childhood nickname?">What is your childhood nickname?</option>
            </select>

            <input type="text" name="security_answer" placeholder="Security Answer" autocomplete="off" required>
            
            <button type="submit" class="btn-auth">REGISTER</button>
        </form>
        <p class="footer-link">Already have an account? <a href="/login">Login</a></p>
    </div>

    <script src="{{ url_for('static', filename='pwa.js') }}" defer></script>
    <script>
        function togglePassword(id, icon) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '🙈';
            } else {
                input.type = 'password';
                icon.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
