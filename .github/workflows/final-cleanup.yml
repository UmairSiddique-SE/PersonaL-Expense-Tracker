name: Final cleanup

on:
  push:
    paths:
      - '.github/workflows/final-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove client-side ordering override
        shell: python
        run: |
          from pathlib import Path
          path = Path('templates/view.html')
          text = path.read_text(encoding='utf-8-sig')
          old = '''<script>\n(function () {\n    const tbody = document.querySelector('#recordsTable tbody');\n    if (!tbody) return;\n    const rows = Array.from(tbody.querySelectorAll('tr[data-record-id]'));\n    rows.sort((a, b) => String(b.dataset.recordId).localeCompare(String(a.dataset.recordId)));\n    rows.forEach(row => tbody.appendChild(row));\n})();\n</script>'''
          if old not in text:
              raise SystemExit('Expected client-side ordering block not found')
          text = text.replace(old, '', 1)
          path.write_text(text, encoding='utf-8')
      - name: Verify
        run: python -m py_compile app.py
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/view.html .github/workflows/final-cleanup.yml
          git rm .github/workflows/final-cleanup.yml
          git commit -m 'fix: preserve backend insertion order in records view'
          git push
